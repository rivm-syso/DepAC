name = "DepAC"
version = "VERSION"
license = "LICENSE"
author = "Marte Voorneveld"
maintainer = "marte.voorneveld@rivm.nl"
copyright = "Copyright 2025, RIVM"


[build]
auto-executables = false
auto-tests = true
auto-examples = false
module-naming = false

[test]
flags = ["-Wno-external-argument-mismatch"]

[install]
library = true

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dev-dependencies]
test-drive.git = "https://github.com/fortran-lang/test-drive"

